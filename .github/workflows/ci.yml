name: CI for Ingestion and Transformation

on:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Build Docker image
        run: |
          docker build -t eurostat-trade-pipeline:ci .

      # Smoke test only: run inside the built image without network downloads.
      # DRY_RUN ensures no data is fetched; this validates wiring and exits fast.
      - name: Smoke test ingestion (no downloads)
        run: |
          docker run --rm \
            -e DRY_RUN=1 \
            eurostat-trade-pipeline:ci \
            python -m src.bronze.fetch --from 2002-12 --to 2003-01

      # Static analysis for bash scripts (common pitfalls, not formatting).
      - name: ShellCheck (bash scripts)
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck src/bronze/*.sh

      - name: Smoke test transform CLI
        run: |
          docker run --rm \
            eurostat-trade-pipeline:ci \
            python -m src.silver.transform --help
